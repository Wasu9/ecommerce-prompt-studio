<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Commerce Prompt Studio — Core Test</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#111827}
main{max-width:760px;margin:20px auto;padding:14px}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin-bottom:16px}
h1{margin-top:0}
label{font-weight:700;display:block;margin:12px 0 6px}
input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #bbb;border-radius:9px;font-size:16px}
textarea{min-height:120px}
.drop{border:2px dashed #777;border-radius:12px;padding:24px;text-align:center;cursor:pointer}
#preview{display:none;max-width:240px;max-height:240px;margin:15px auto;border-radius:10px}
button{padding:12px 16px;border:0;border-radius:9px;background:#111827;color:white;font-weight:700;margin:8px 5px 0 0;cursor:pointer}
#status{padding:10px;border-radius:9px;background:#f1f5f9;margin-top:12px}
.prompt{white-space:pre-wrap;background:#111827;color:#fff;padding:15px;border-radius:10px;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🛍️ E-Commerce Prompt Studio</h1>
<p>Core working test — image upload, prompt generation and copy.</p>

<label>Product Name</label>
<input id="product" placeholder="Example: Black laptop backpack">

<label>Product Category</label>
<select id="category">
<option>Bag / Backpack</option>
<option>Fashion</option>
<option>Footwear</option>
<option>Jewellery</option>
<option>Beauty / Cosmetics</option>
<option>Electronics</option>
<option>Home & Furniture</option>
<option>Kitchen</option>
<option>Kids / Baby</option>
<option>Other</option>
</select>

<label>Product Reference Image</label>
<div class="drop" id="drop">
<strong>Tap here to select product image</strong><br>
<small>JPG / PNG / WEBP</small>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp" style="display:none">
</div>
<img id="preview" alt="Product preview">
<div id="status">Status: waiting for product image.</div>
</div>

<div class="card">
<label>Image Angle</label>
<select id="angle">
<option>Front hero view</option>
<option>45-degree front view</option>
<option>Right side view</option>
<option>Left side view</option>
<option>Back view</option>
<option>Top / detail view</option>
<option>Interior / inside view</option>
<option>Close-up material detail</option>
<option>Lifestyle / in-use view</option>
</select>

<label>Model</label>
<select id="model">
<option>Product only — no model</option>
<option>Indian male adult</option>
<option>Indian female adult</option>
<option>Foreign male adult</option>
<option>Foreign female adult</option>
<option>Indian child</option>
<option>Foreign child</option>
<option>Family</option>
<option>Senior model</option>
</select>

<label>Extra Requirements</label>
<textarea id="extra" placeholder="White background, premium lighting, exact logo, realistic material, etc."></textarea>

<button id="generate">✨ Generate Prompt</button>
<button id="copy" style="display:none">📋 Copy Prompt</button>
</div>

<div class="card">
<h2>Generated Prompt</h2>
<div id="result">No prompt generated yet.</div>
</div>
</main>

<script>
(function(){
  const file = document.getElementById('file');
  const drop = document.getElementById('drop');
  const preview = document.getElementById('preview');
  const status = document.getElementById('status');
  const generate = document.getElementById('generate');
  const copy = document.getElementById('copy');
  const result = document.getElementById('result');

  drop.addEventListener('click', function(){ file.click(); });

  file.addEventListener('change', function(){
    const selected = file.files && file.files[0];
    if(!selected){ return; }
    if(!selected.type.startsWith('image/')){
      status.textContent = 'Status: selected file is not an image.';
      return;
    }
    const url = URL.createObjectURL(selected);
    preview.src = url;
    preview.style.display = 'block';
    status.textContent = 'Status: image uploaded successfully — ' + selected.name;
  });

  generate.addEventListener('click', function(){
    const product = document.getElementById('product').value.trim() || 'the uploaded product';
    const category = document.getElementById('category').value;
    const angle = document.getElementById('angle').value;
    const model = document.getElementById('model').value;
    const extra = document.getElementById('extra').value.trim();

    const prompt =
`Create a professional photorealistic e-commerce product image.

PRODUCT: ${product}
CATEGORY: ${category}
SHOT: ${angle}
MODEL: ${model}

Use the uploaded product reference as the authoritative visual reference. Preserve the exact product identity, shape, proportions, color, materials, texture, stitching, seams, hardware, logo and all visible details. Do not redesign, recolor, add, remove or invent product features.

Use clean commercial photography, accurate perspective, realistic lighting, natural shadows and sharp product detail. Keep the product clearly visible and correctly scaled.

${extra ? 'ADDITIONAL REQUIREMENTS: ' + extra : ''}

Avoid watermarks, random text, fake branding, duplicate products, distorted anatomy and unwanted props.`;

    result.textContent = prompt;
    copy.style.display = 'inline-block';
    status.textContent = 'Status: prompt generated successfully.';
  });

  copy.addEventListener('click', async function(){
    const text = result.textContent;
    try{
      await navigator.clipboard.writeText(text);
      status.textContent = 'Status: prompt copied to clipboard.';
    }catch(e){
      const ta=document.createElement('textarea');
      ta.value=text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
      status.textContent = 'Status: prompt copied.';
    }
  });
})();
</script>
</body>
</html>
