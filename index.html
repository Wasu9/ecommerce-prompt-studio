<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Commerce Product Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:Arial;color:#18212b}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #0001}h1{margin:0 0 5px}.sub{color:#687482}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-weight:700;font-size:14px}input,select,textarea{width:100%;padding:11px;margin-top:6px;border:1px solid #d5dbe1;border-radius:9px;font-size:15px}textarea{min-height:80px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.choice{border:1px solid #d5dbe1;border-radius:9px;padding:11px}.choice input{width:auto;margin:0 6px 0 0}.primary{width:100%;padding:14px;border:0;border-radius:10px;background:#111827;color:white;font-size:17px;font-weight:bold}.row{display:flex;gap:8px;margin-top:9px}.row button{flex:1;padding:11px;border:0;border-radius:9px}.out{white-space:pre-wrap;background:#111827;color:white;padding:14px;border-radius:10px;min-height:130px}.preview{max-width:160px;max-height:160px;display:none;margin-top:10px;border-radius:8px}@media(max-width:600px){.grid,.choices{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap">
<div class="card"><h1>🛍️ E-Commerce Product Image Studio</h1><div class="sub">Simple product image → model / props / location → ready prompt</div></div>
<div class="card"><h3>1. Product</h3><div class="grid">
<div class="full"><label>Product Image<input id="img" type="file" accept="image/*"></label><img id="prev" class="preview"></div>
<div><label>Product Name<input id="name" placeholder="Hair Clip"></label></div><div><label>Category<input id="cat" placeholder="Accessories"></label></div>
<div><label>Product Details<textarea id="details" placeholder="Material, color, finish, size..."></textarea></label></div><div><label>Color / Material<input id="mat" placeholder="Black metal, glossy finish"></label></div></div></div>
<div class="card"><h3>2. Shot / Camera</h3><div class="grid"><div><label>Shot<select id="shot"><option>Front</option><option>45-degree Front</option><option>Side</option><option>Back</option><option>Top</option><option>Close-up / Detail</option><option>Product in Use</option><option>Flat Lay</option></select></label></div><div><label>Camera Look<select id="camera"><option>Professional e-commerce photography</option><option>Luxury studio photography</option><option>Natural lifestyle photography</option><option>Premium fashion photography</option></select></label></div></div></div>
<div class="card"><h3>3. Model</h3><div class="choices">
<label class="choice"><input type="radio" name="model" value="without" checked>Without Model</label>
<label class="choice"><input type="radio" name="model" value="one">1 Model</label>
<label class="choice"><input type="radio" name="model" value="two">2 Separate Models</label>
<label class="choice"><input type="radio" name="model" value="three">3 Separate Models</label>
<label class="choice"><input type="radio" name="model" value="male">Male Model</label>
<label class="choice"><input type="radio" name="model" value="female">Female Model</label>
<label class="choice"><input type="radio" name="model" value="both">Male + Female</label></div></div>
<div class="card"><h3>4. Location / Scene</h3><div class="grid"><div><label>Location<select id="loc"><option>Clean Studio</option><option>Bedroom</option><option>Living Room</option><option>Bathroom</option><option>Office</option><option>Outdoor</option><option>Street</option><option>Luxury Interior</option><option>Fashion Store</option><option>Beach / Resort</option><option>Custom</option></select></label></div><div><label>Scene<select id="scene"><option>Minimal clean background</option><option>Premium lifestyle setup</option><option>Natural realistic environment</option><option>Luxury commercial setup</option><option>Soft aesthetic setup</option></select></label></div></div></div>
<div class="card"><h3>5. Props</h3><div class="grid"><div><label>Product Props<select id="props"><option>Without Props</option><option>Minimal relevant props</option><option>Luxury props</option><option>Natural lifestyle props</option><option>Fashion props</option><option>Beauty props</option><option>Custom Props</option></select></label></div><div><label>Custom Props<input id="custom" placeholder="Optional"></label></div></div></div>
<div class="card"><h3>6. Lighting & Output</h3><div class="grid"><div><label>Lighting<select id="light"><option>Soft studio lighting</option><option>Bright commercial lighting</option><option>Natural daylight</option><option>Warm lifestyle lighting</option><option>Dramatic premium lighting</option></select></label></div><div><label>Aspect Ratio<select id="ratio"><option>1:1</option><option>4:5</option><option>9:16</option><option>16:9</option></select></label></div></div></div>
<div class="card"><button class="primary" onclick="gen()">✨ Generate Image Prompt</button><div class="row"><button onclick="copy()">Copy Prompt</button><button onclick="location.reload()">Reset</button></div></div>
<div class="card"><h3>Generated Prompt</h3><div id="out" class="out">Your prompt will appear here.</div></div>
</div>
<script>
img.onchange=()=>{let f=img.files[0];if(f){prev.src=URL.createObjectURL(f);prev.style.display='block'}};
function gen(){let m=document.querySelector('[name=model]:checked').value,mt={without:'No human model; product only',one:'One realistic model',two:'Two separate realistic models, clearly distinct',three:'Three separate realistic models, clearly distinct',male:'One realistic male model',female:'One realistic female model',both:'One realistic male and one realistic female model'}[m];
out.textContent=`Create a professional e-commerce product image for "${name.value||'the product'}" (${cat.value||'product'}).

PRODUCT REFERENCE & CONSISTENCY:
Use the uploaded product image as the authoritative reference. Preserve exact identity, silhouette, proportions, dimensions, colors, finish, materials, texture, stitching, seams, hardware, labels, logo and branding. Do not redesign, recolor, simplify, add or remove product features.

PRODUCT DETAILS:
${details.value||'Preserve all visible details from the reference image.'}
${mat.value?'Color / material: '+mat.value:''}

SHOT:
${shot.value}. ${camera.value}.

MODEL:
${mt}. Keep the product as the visual priority and do not alter the product to fit the model.

LOCATION:
${loc.value}. ${scene.value}.

PROPS:
${props.value}${custom.value?', specifically: '+custom.value:''}. Props must support the product and never hide or modify it.

LIGHTING:
${light.value}.

OUTPUT:
${ratio.value}, photorealistic, sharp product details, realistic shadows, premium commercial quality, clean composition, ready for e-commerce listing.`}
function copy(){navigator.clipboard.writeText(out.textContent);alert('Prompt copied')}
</script></body></html>
